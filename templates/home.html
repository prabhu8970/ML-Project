<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Exam Performance Indicator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="page-container">

        <div class="login-card">

            <div class="header">
                <div class="icon">🎓</div>

                <h1>Student Exam Performance</h1>

                <p>
                    Predict your Mathematics score using student
                    performance information
                </p>
            </div>

            <form action="{{ url_for('predict_datapoint') }}"
                  method="post">

                <!-- Gender -->
                <div class="form-group">
                    <label>Gender</label>

                    <select name="gender" required>
                        <option value="" selected disabled>
                            Select your Gender
                        </option>

                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <!-- Ethnicity -->
                <div class="form-group">
                    <label>Race or Ethnicity</label>

                    <select name="ethnicity" required>
                        <option value="" selected disabled>
                            Select Ethnicity
                        </option>

                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <!-- Parent Education -->
                <div class="form-group">
                    <label>Parental Level of Education</label>

                    <select name="parental_level_of_education" required>

                        <option value="" selected disabled>
                            Select Parent Education
                        </option>

                        <option value="associate's degree">
                            Associate's Degree
                        </option>

                        <option value="bachelor's degree">
                            Bachelor's Degree
                        </option>

                        <option value="high school">
                            High School
                        </option>

                        <option value="master's degree">
                            Master's Degree
                        </option>

                        <option value="some college">
                            Some College
                        </option>

                        <option value="some high school">
                            Some High School
                        </option>

                    </select>
                </div>

                <!-- Lunch -->
                <div class="form-group">
                    <label>Lunch Type</label>

                    <select name="lunch" required>

                        <option value="" selected disabled>
                            Select Lunch Type
                        </option>

                        <option value="free/reduced">
                            Free / Reduced
                        </option>

                        <option value="standard">
                            Standard
                        </option>

                    </select>
                </div>

                <!-- Test Preparation -->
                <div class="form-group">
                    <label>Test Preparation Course</label>

                    <select name="test_preparation_course" required>

                        <option value="" selected disabled>
                            Select Test Course
                        </option>

                        <option value="none">
                            None
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                    </select>
                </div>

                <!-- Reading Score -->
                <div class="form-group">
                    <label>Reading Score (out of 100)</label>

                    <input
                        type="number"
                        name="reading_score"
                        placeholder="Enter Reading Score"
                        min="0"
                        max="100"
                        required>
                </div>

                <!-- Writing Score -->
                <div class="form-group">
                    <label>Writing Score (out of 100)</label>

                    <input
                        type="number"
                        name="writing_score"
                        placeholder="Enter Writing Score"
                        min="0"
                        max="100"
                        required>
                </div>

                <!-- Submit -->
                <button type="submit" class="predict-btn">
                    Predict Mathematics Score
                    <span>→</span>
                </button>

            </form>

            {% if results %}
            <div class="result-box">

                <div class="result-icon">📊</div>

                <div>
                    <p>Predicted Mathematics Score</p>

                    <h2>{{ results }}</h2>
                </div>

            </div>
            {% endif %}

            <div class="footer">
                <p>Machine Learning • Student Performance Prediction</p>
            </div>

        </div>

    </div>

</body>
</html>
